name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Path to the site that ships to hexokit.com. Change this single value to swap
# which site under sites/ is built and deployed.
env:
  SITE_DIR: sites/astro-starlight-terminal1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.SITE_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.SITE_DIR }}
        run: pnpm install --frozen-lockfile

      # The canonical script lives in sahil87/shll (versioned next to the CLI
      # it bootstraps); the site serves a deploy-time COPY of it at
      # hexokit.com/install, with the product-first default composed onto its
      # last line by the next step. -f is deliberate: if the script is missing
      # upstream, fail the deploy rather than ship a site whose documented
      # one-liner 404s.
      - name: Fetch install script (served at hexokit.com/install)
        working-directory: ${{ env.SITE_DIR }}
        run: curl -fsSL https://raw.githubusercontent.com/sahil87/shll/main/scripts/install.sh -o public/install

      # hexokit.com serves a deploy-time COPY of the canonical script with a
      # product-first default composed onto its last line (no args → shll +
      # HexoKit; tool args pass through). The composer fails the deploy if the
      # upstream no longer ends in `main "$@"` — a served installer must never
      # be half-composed. See docs/memory/build-deploy/install-endpoint.md.
      - name: Compose the product-first default onto the install script
        working-directory: ${{ env.SITE_DIR }}
        run: node scripts/compose-install.mjs public/install

      - name: Build with Astro
        working-directory: ${{ env.SITE_DIR }}
        run: pnpm build
        env:
          # Automatic token for the build-time per-tool star-count fetch
          # (src/lib/github-stars.ts): unauthenticated GitHub API calls from
          # shared Actions-runner IPs rate-limit unpredictably; the token
          # raises the limit with zero secret management. The fetch is
          # fail-soft — without the token (or on any API failure) the build
          # still succeeds and the counts are simply omitted.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
